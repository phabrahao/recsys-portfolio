[project]
name = "recsys-portfolio"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "phabrahao", email = "phribeiroabrahao@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.5",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.1",
    "polars>=1.43.2",
    "pyarrow>=25.0.1",
    "seaborn>=0.13.2",
]

[project.scripts]
recsys-portfolio = "recsys_portfolio:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
